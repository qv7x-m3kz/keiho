name: 朝刊を刷る

on:
  schedule:
    - cron: '0 21 * * *' # 毎朝6:00 JST（UTCでは前日21:00）
  workflow_dispatch: # 手動ボタンでも刷れるように

permissions:
  contents: write # アーカイブをリポジトリに保存するため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 紙面を生成
        run: python build.py

      - name: アーカイブをリポジトリに保存
        run: |
          git config user.name "qv7x-m3kz"
          git config user.email "250904501+qv7x-m3kz@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "紙面に変更なし、保存スキップ"
          else
            git commit -m "アーカイブ: $(TZ=Asia/Tokyo date '+%Y-%m-%d') の紙面"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Pages用に紙面をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
