<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e1d3d">
<meta name="apple-mobile-web-app-title" content="かん報">
<title>かん報 — %%TITLE_DATE%%</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<style>
  :root {
    --bg: #eef1f6;
    --surface: #ffffff;
    --ink: #1b2a4a;
    --ink-soft: #51617f;
    --ink-faint: #8b97ad;
    --navy: #0e1d3d;
    --navy-soft: #9fb3d9;
    --accent: #2f6fed;
    --accent-weak: #e3ecfd;
    --rule: #dfe5ee;
    --gothic: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--gothic);
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  a:hover .headline, a:hover.headline { color: var(--accent); }

  /* ===== マストヘッド（紺帯） ===== */
  .masthead-band { background: var(--navy); color: #fff; }
  .masthead-inner { max-width: 1000px; margin: 0 auto; padding: 18px 20px 26px; }
  .top-bar {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--navy-soft);
    letter-spacing: 0.08em;
    margin-bottom: 14px;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    line-height: 1.15;
  }
  .masthead .edition {
    font-size: 12px;
    color: var(--navy-soft);
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    margin-top: 8px;
  }
  .crawl-note {
    font-size: 11.5px;
    color: var(--ink-faint);
    text-align: center;
    letter-spacing: 0.06em;
    padding: 12px 16px 0;
  }

  .sheet { max-width: 1000px; margin: 0 auto; padding: 16px 20px 56px; }

  /* ===== カード共通 ===== */
  .card {
    background: var(--surface);
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(14, 29, 61, 0.06), 0 4px 16px rgba(14, 29, 61, 0.05);
    padding: 26px 28px;
    margin-top: 16px;
  }

  /* ===== 共通パーツ ===== */
  .kicker {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    letter-spacing: 0.2em;
    text-indent: 0.1em;
    padding: 3px 12px;
    border-radius: 999px;
  }
  .meta { font-size: 12px; color: var(--ink-faint); letter-spacing: 0.03em; }
  .meta .src { color: var(--ink-soft); font-weight: 600; }
  .meta .score { color: var(--accent); font-weight: 600; }
  .tags { display: inline-flex; gap: 6px; flex-wrap: wrap; vertical-align: middle; }
  .tag {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-weak);
    padding: 2px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .excerpt { font-size: 13.5px; color: var(--ink-soft); }
  .empty-note { font-size: 13px; color: var(--ink-faint); padding: 16px 2px 4px; }

  /* ===== 一面 ===== */
  .front-top .headline {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.5;
    margin: 12px 0 10px;
  }
  .front-top .excerpt { font-size: 14.5px; max-width: 46em; }
  .front-top .meta { margin-top: 12px; }
  .front-subs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 32px;
    margin-top: 24px;
    padding-top: 22px;
    border-top: 1px solid var(--rule);
  }
  .front-subs article + article { border-left: 1px solid var(--rule); padding-left: 32px; }
  .front-subs .headline { font-size: 17px; font-weight: 700; line-height: 1.55; margin-bottom: 6px; }
  .front-subs .excerpt { margin-bottom: 8px; }

  /* ===== セクション ===== */
  .section-head {
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 2px solid var(--navy);
    padding-bottom: 10px;
  }
  .section-head h2 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    font-size: 22px;
    color: var(--accent);
  }
  .section-head .count { font-size: 12px; color: var(--ink-faint); }
  .section article { padding: 16px 2px; border-bottom: 1px solid var(--rule); }
  .section article:last-of-type { border-bottom: none; }
  .section article.extra { display: none; }
  .section.open article.extra { display: block; }
  .section .headline { font-size: 15.5px; font-weight: 700; line-height: 1.6; }
  .section .excerpt { margin-top: 3px; }
  .section .meta { margin-top: 5px; }

  .more-btn {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 10px;
    font-family: var(--gothic);
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-weak);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: background 0.15s;
  }
  .more-btn:hover { background: #d3e2fb; }

  /* ===== フッター ===== */
  footer {
    margin-top: 36px;
    text-align: center;
    font-size: 11.5px;
    color: var(--ink-faint);
    letter-spacing: 0.15em;
  }

  /* ===== スマホ ===== */
  @media (max-width: 640px) {
    .sheet { padding: 12px 12px 44px; }
    .masthead-inner { padding: 14px 16px 20px; }
    .masthead h1 { font-size: 38px; }
    .masthead .edition { font-size: 10.5px; letter-spacing: 0.16em; text-indent: 0.16em; }
    .crawl-note { font-size: 10.5px; letter-spacing: 0.02em; }
    .card { padding: 20px 18px; border-radius: 12px; }
    .front-top .headline { font-size: 21px; }
    .front-subs { grid-template-columns: 1fr; gap: 18px; }
    .front-subs article + article { border-left: none; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 18px; }
    .section .headline { font-size: 15px; }
  }
</style>
</head>
<body>

<div class="masthead-band">
  <div class="masthead-inner">
    <div class="top-bar">
      <span>%%DATE_LINE%%</span>
      <span>%%ISSUE%%</span>
    </div>
    <header class="masthead">
      <h1>かん報</h1>
      <p class="edition">%%TAGLINE%%</p>
    </header>
  </div>
</div>

<p class="crawl-note">%%CRAWL_NOTE%%</p>

<div class="sheet">

%%FRONT%%

%%SECTIONS%%

  <footer>
    かん報　—　%%GENERATED_AT%% 刷り上がり ／ produced by くろえもん
  </footer>

</div>

<script>
  document.querySelectorAll('.more-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var sec = btn.closest('.section');
      sec.classList.toggle('open');
      var n = btn.dataset.count;
      btn.textContent = sec.classList.contains('open')
        ? '閉じる ▲'
        : 'もっとみる（あと' + n + '件）▼';
    });
  });
</script>
</body>
</html>
